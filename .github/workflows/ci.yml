name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore backend/MovieFlix.sln

      - name: Build
        run: dotnet build backend/MovieFlix.sln --configuration Release --no-restore

      # The integration tests run against an isolated in-memory SQLite
      # database in the `Testing` environment (appsettings.Testing.json), so
      # no secrets and no network access are required.
      - name: Test
        run: >-
          dotnet test backend/MovieFlix.Api.Tests/MovieFlix.Api.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
